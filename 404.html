<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found | Armor Hub</title>
    <meta name="theme-color" content="#0C0A09">
    <link rel="icon" type="image/png" href="/images/HLL_Icons/Map Markers/icn_tank_marker.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Chakra+Petch:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tokens.css?v=20261005c">
    <link rel="stylesheet" href="/css/base.css?v=20261005c">
    <style>
        .err-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            text-align: center;
        }
        .err-box {
            max-width: 420px;
            padding: 2rem 1.6rem;
            border-radius: var(--r-xl);
            background: var(--glass-strong);
            border: 1px solid var(--glass-border);
        }
        .err-box h1 {
            font-family: var(--font-display);
            font-size: 4rem;
            color: var(--gold-glow);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        .err-box h2 {
            font-family: var(--font-display);
            font-size: 1.1rem;
            margin-bottom: 0.75rem;
        }
        .err-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.4rem;
        }
        .err-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="atmosphere" aria-hidden="true"></div>
    <main class="err-page">
        <div class="err-box">
            <h1>404</h1>
            <h2>Target not found</h2>
            <p>That page does not exist or may have moved with the site rebuild.</p>
            <div class="err-actions">
                <a class="btn btn-primary" href="/app.html#/community">Back to the Hub</a>
            </div>
        </div>
    </main>
</body>
</html>
